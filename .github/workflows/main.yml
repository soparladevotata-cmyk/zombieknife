name: Build ZombieKnifeMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ZombieKnifeMenu/**"
      - ".github/workflows/build-zombieknife.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "./ZombieKnifeMenu/ZombieKnifeMenu.csproj"

      - name: Build Release
        run: dotnet build "./ZombieKnifeMenu/ZombieKnifeMenu.csproj" --configuration Release --no-restore

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ZombieKnifeMenu-net10
          path: ZombieKnifeMenu/bin/Release/net10.0/
          if-no-files-found: error
