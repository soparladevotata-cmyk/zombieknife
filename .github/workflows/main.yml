name: Build ZombieKnifeMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name "ZombieKnifeMenu.csproj" -print -quit)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Restore
        run: dotnet restore "${{ steps.project.outputs.project }}"

      - name: Build
        run: dotnet publish "${{ steps.project.outputs.project }}" -c Release -o publish

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ZombieKnifeMenu
          path: publish/ZombieKnifeMenu.dll
