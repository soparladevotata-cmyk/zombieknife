name: Build ZombieKnifeMenu

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ZombieKnifeMenu.csproj

      - name: Build
        run: dotnet publish ZombieKnifeMenu.csproj -c Release -o publish

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ZombieKnifeMenu
          path: publish/ZombieKnifeMenu.dll
